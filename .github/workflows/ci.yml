name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: seatlock
          POSTGRES_PASSWORD: seatlock_dev
          POSTGRES_DB: seatlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatlock"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://seatlock:seatlock_dev@localhost:5432/seatlock
      JWT_SECRET: ci-test-secret-at-least-16-chars
      NODE_ENV: test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Typecheck backend
        run: npm run typecheck -w packages/backend

      - name: Run tests
        run: npm run test

      - name: Run concurrency tests
        run: npm run test:concurrency

      - name: Build frontend
        run: npm run build -w packages/frontend
